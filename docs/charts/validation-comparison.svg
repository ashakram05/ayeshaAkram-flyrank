<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Grouped versus chronological Precision at 20</title><desc id="desc">Precision at 20 for baseline is 0.75 in both designs, Logistic Regression moves from 0.65 grouped to 0.85 chronological, and Random Forest moves from 0.75 to 0.70.</desc><rect width="760" height="430" fill="#fff"/><g font-family="Arial, sans-serif" fill="#20252b"><text x="70" y="35" font-size="18" font-weight="700">Validation design · Precision@20</text><g stroke="#d9dee3" stroke-width="1"><path d="M80 350H720M80 290H720M80 230H720M80 170H720M80 110H720M80 50H720"/></g><g font-size="12" fill="#5c6670"><text x="48" y="354">0.0</text><text x="48" y="294">0.2</text><text x="48" y="234">0.4</text><text x="48" y="174">0.6</text><text x="48" y="114">0.8</text><text x="48" y="54">1.0</text><text x="180" y="380">Grouped client holdout</text><text x="486" y="380">Chronological</text></g><g fill="none" stroke-width="4"><path d="M230 125L535 125" stroke="#8b969d"/><path d="M230 155L535 95" stroke="#0b6b69"/><path d="M230 125L535 140" stroke="#d17c3f"/></g><g fill="#8b969d"><circle cx="230" cy="125" r="7"/><circle cx="535" cy="125" r="7"/></g><g fill="#0b6b69"><circle cx="230" cy="155" r="7"/><circle cx="535" cy="95" r="7"/></g><g fill="#d17c3f"><circle cx="230" cy="125" r="7"/><circle cx="535" cy="140" r="7"/></g><g font-size="13" text-anchor="middle"><text x="230" y="113">.75</text><text x="535" y="113">.75</text><text x="230" y="177">.65</text><text x="535" y="87">.85</text><text x="230" y="145">.75</text><text x="535" y="160">.70</text></g><g font-size="12"><rect x="112" y="405" width="12" height="4" fill="#8b969d"/><text x="132" y="410">Baseline</text><rect x="210" y="405" width="12" height="4" fill="#0b6b69"/><text x="230" y="410">Logistic Regression</text><rect x="390" y="405" width="12" height="4" fill="#d17c3f"/><text x="410" y="410">Random Forest</text></g></g></svg>